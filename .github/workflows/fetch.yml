name: Weekly Woolworths fetch
# Wednesday ~8:30am Sydney (21:30 UTC Tue in AEDT / 22:30 in AEST), with retries Wed evening and Thu.
on:
  schedule:
    - cron: '30 21 * * 2'
    - cron: '30 7 * * 3'
    - cron: '30 21 * * 3'
  workflow_dispatch:
    inputs:
      force:
        description: 'Fetch again even if this week is already done (1 = yes)'
        default: '0'
permissions:
  contents: write
concurrency: { group: fetch, cancel-in-progress: false }
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install requests tzdata
      - run: python scripts/fetch.py
        env:
          # Main key first, then backups in order (add APIFY_TOKEN_2 ... APIFY_TOKEN_5 as GitHub secrets).
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_TOKEN_2: ${{ secrets.APIFY_TOKEN_2 }}
          APIFY_TOKEN_3: ${{ secrets.APIFY_TOKEN_3 }}
          APIFY_TOKEN_4: ${{ secrets.APIFY_TOKEN_4 }}
          APIFY_TOKEN_5: ${{ secrets.APIFY_TOKEN_5 }}
          FORCE: ${{ github.event.inputs.force || '0' }}
      - name: Build page data
        if: success()
        run: python scripts/build.py
      - name: Save candidates
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ docs/
          git commit -m "Weekly candidates from Woolworths" || echo "nothing new"
          git pull -q --rebase -X ours || true
          git push
