name: Build page data
on:
  push:
    paths: ['data/confirmations.json', 'scripts/build.py']
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: build, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python scripts/build.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ data/pending.json
          git commit -m "Rebuild page data" || echo "nothing new"
          git pull -q --rebase -X ours || true
          git push
