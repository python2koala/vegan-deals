name: Apify Woolworths test
on:
  push:
    paths: ['.github/workflows/apify-test.yml', 'scripts/apify_test.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install requests
      - run: python scripts/apify_test.py
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      - name: Save result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull -q
          git add apify-test-result.json
          git commit -m "Apify test result" || true
          git push
